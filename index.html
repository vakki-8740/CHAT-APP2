<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f6bed" />
    <meta name="description" content="Private real-time chat and voice notes." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f6bed'/%3E%3Cpath d='M9 12.5A3.5 3.5 0 0 1 12.5 9h7A3.5 3.5 0 0 1 23 12.5v4a3.5 3.5 0 0 1-3.5 3.5H15l-4.2 3.4a.6.6 0 0 1-1-.5V12.5Z' fill='white'/%3E%3C/svg%3E"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Personal Chat</title>
    <script>
      try {
        var vt = localStorage.getItem("theme");
        if (vt) document.documentElement.setAttribute("data-theme", vt);
        else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
